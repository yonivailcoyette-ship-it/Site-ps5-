<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack PS5 avec 2 manettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--surface:#fff;--stage:#dde6f6;--ink:#0f1a33;--muted:#53607c;--line:#d0d8ea;--blue:#0a3fd0;--blue-ink:#fff;--shell:#fff;--core:#10182b;--glow:#3b8cff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--surface:#141b30;--stage:#101831;--ink:#eaf0ff;--muted:#9aa8c9;--line:#26304d;--blue:#5b8dff;--blue-ink:#07112e;--shell:#e9eef9;--core:#05070f;--glow:#6aa6ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--surface:#141b30;--stage:#101831;--ink:#eaf0ff;--muted:#9aa8c9;--line:#26304d;--blue:#5b8dff;--blue-ink:#07112e;--shell:#e9eef9;--core:#05070f;--glow:#6aa6ff;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font:700 1.6rem 'Barlow Condensed','Arial Narrow',sans-serif}
a{color:inherit}
.btn{display:inline-block;background:var(--blue);color:var(--blue-ink);border:0;border-radius:10px;padding:14px 26px;font:600 1rem 'Public Sans',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.hero{display:grid;gap:28px;padding:16px 0 52px;align-items:center}
@media(min-width:760px){.hero{grid-template-columns:1.15fr .85fr}}
h1,h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;margin:0}
h1{font-size:clamp(2.8rem,10vw,5.2rem);line-height:.92}
h2{font-size:2rem;margin-bottom:14px}
.lead{max-width:44ch;color:var(--muted);margin:16px 0 0}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0}
.price strong{font:700 3.6rem/1 'Barlow Condensed','Arial Narrow',sans-serif;color:var(--blue)}
.price span{color:var(--muted)}
